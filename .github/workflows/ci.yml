name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: hogwarts_test
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_USER: hogwarts
        options: >-
          --health-cmd "pg_isready -U hogwarts -d hogwarts_test"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
        ports:
          - 55432:5432
    env:
      TEST_DATABASE_URL: postgres://hogwarts:local-development-only@127.0.0.1:55432/hogwarts_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          cache: npm
          node-version: 24.18.0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.0
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2.9.2
      - run: npm ci
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace
      - run: node scripts/check-boundaries.mjs
      - run: npm run generate:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: node scripts/scan-secrets.mjs
